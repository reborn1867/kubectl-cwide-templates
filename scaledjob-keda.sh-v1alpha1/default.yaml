columns:
    - header: NAME
      fieldSpec: .metadata.name
    - header: MIN
      fieldSpec: .spec.minReplicaCount
    - header: MAX
      fieldSpec: .spec.maxReplicaCount
    - header: READY
      fieldSpec: .status.conditions[?(@.type=="Ready")].status
    - header: ACTIVE
      fieldSpec: .status.conditions[?(@.type=="Active")].status
    - header: PAUSED
      fieldSpec: .status.conditions[?(@.type=="Paused")].status
    - header: TRIGGERS
      fieldSpec: .status.triggersTypes
    - header: AUTHENTICATIONS
      fieldSpec: .status.authenticationsTypes
    - header: AGE
      fieldSpec: .metadata.creationTimestamp
