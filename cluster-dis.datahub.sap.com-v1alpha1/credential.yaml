columns:
  - header: NAME
    fieldSpec: .metadata.name
  - header: ROTATION_STATE
    fieldSpec: .status.state
  - header: STATE
    fieldSpec: .status.lastMessage
  - header: AUDITLOG_SERVICE_KEY
    template: '{{ template "CredentialVersions" (index .status.credentialStatus.credentials "auditlog-service-key") }}'
  - header: AUDITLOG_SERVICE_KEY_OAUTH2
    template: '{{ template "CredentialVersions" (index .status.credentialStatus.credentials "auditlog-service-key-oauth2") }}'
  - header: HANA_CLOUD_SERVICE_KEY
    template: '{{ template "CredentialVersions" (index .status.credentialStatus.credentials "hana-cloud-service-key") }}'
  - header: VFLOW_SECRET
    template: '{{ template "CredentialVersions" (index .status.credentialStatus.credentials "vflow-secret") }}'
  - header: RCLONE_SECRET
    template: '{{ template "CredentialVersions" (index .status.credentialStatus.credentials "rclone-secret") }}'
helpers: |
  {{- define "CredentialVersions" }}
  {{- printf "%s/%s" .version .nextVersion }}
  {{- end }}
